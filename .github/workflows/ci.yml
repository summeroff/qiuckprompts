# Build, test, format-check, and (on version tags) publish a Windows x64 release.
#
# Jobs:
#   format — clang-format dry-run against .clang-format (Allman braces, } else { ok)
#   build  — VS 2022 Debug + --self-test; Velopack Setup + zip on tags v*
#
# Version: local/PR/untagged CI → CMake default 0.0.0-dev.
#          tag vX.Y.Z → -DQP_RELEASE_VERSION=X.Y.Z (no leading v).

name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  format:
    name: Format (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          chmod +x scripts/format.sh
          ./scripts/format.sh --check

  build:
    name: Build & test (Windows x64)
    needs: format
    runs-on: windows-2022

    permissions:
      contents: write  # needed to create releases on tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -match '^refs/tags/v(.+)$') {
            $v = $Matches[1]
            Write-Host "Tagged release version: $v"
            "version=$v" >> $env:GITHUB_OUTPUT
            "is_release=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Non-tag build — CMake default 0.0.0-dev"
            "version=" >> $env:GITHUB_OUTPUT
            "is_release=false" >> $env:GITHUB_OUTPUT
          }

      - name: Configure (VS 2022 x64)
        shell: pwsh
        run: |
          $args = @('-S', '.', '-B', 'build', '-G', 'Visual Studio 17 2022', '-A', 'x64')
          if ('${{ steps.ver.outputs.is_release }}' -eq 'true') {
            $args += "-DQP_RELEASE_VERSION=${{ steps.ver.outputs.version }}"
          }
          Write-Host "cmake $($args -join ' ')"
          & cmake @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Debug
        run: cmake --build build --config Debug --parallel

      - name: Self-test
        run: .\build\Debug\qiuckprompts.exe --self-test

      - name: Upload Debug artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: qiuckprompts-debug-win-x64
          path: |
            build/Debug/qiuckprompts.exe
            build/Debug/qiuckprompts.pdb
          if-no-files-found: error
          retention-days: 14

      # ---------- Release path (version tags only) ----------
      - name: Build RelWithDebInfo
        if: startsWith(github.ref, 'refs/tags/v')
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Smoke-test release binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\build\RelWithDebInfo\qiuckprompts.exe --self-test

      - name: Package portable zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "qiuckprompts-$tag-win-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "build/RelWithDebInfo/qiuckprompts.exe" "$dir/"
          if (Test-Path "build/RelWithDebInfo/qiuckprompts.pdb") {
            Copy-Item "build/RelWithDebInfo/qiuckprompts.pdb" "$dir/"
          }
          if (Test-Path "README.md") { Copy-Item "README.md" "$dir/" }
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   "$dir/" }
          if (Test-Path "config")    { Copy-Item "config" "$dir/config" -Recurse }
          if (Test-Path "extension") { Copy-Item "extension" "$dir/extension" -Recurse }
          Compress-Archive -Path "$dir/*" -DestinationPath "$name.zip" -Force
          Get-Item "$name.zip" | Format-List Name, Length, FullName

      - name: Setup .NET (for vpk)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Velopack CLI (vpk)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Velopack pack (Setup + nupkg)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          & scripts\pack-velopack.bat $ver RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem releases | Format-Table Name, Length

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qiuckprompts-*-win-x64.zip
            releases/QiuckPrompts-win-Setup.exe
            releases/QiuckPrompts-win-Portable.zip
            releases/*-full.nupkg
            releases/releases.win.json
            releases/assets.win.json
            releases/RELEASES
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
