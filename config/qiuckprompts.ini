; qiuckprompts.ini — ALL config in this one file. Restart app after edits.
;
; Each [section] = one hotkey binding (service + URL + prompt together).
;
; prompt — three forms:
;   1) Multi-line block (preferred):
;        prompt<<<
;        your text here
;        can use ; freely and ``` fences
;        >>>
;   2) Single line:  prompt=Short instruction:
;   3) External file (optional): prompt=path\to\file.txt
;
; hotkey: Ctrl+Alt+J  (Ctrl, Alt, Shift, Win + letter/digit/F1..)
; Placeholders in prompts:
;   {{TEXT}}    = captured editor text (Ctrl+A/C from the focused field)
;   {{CONTEXT}} = clipboard contents at hotkey time (before capture). Workflow:
;                 select context on a page → Ctrl+C → focus draft field → hotkey.

[settings]
browser_hint=Chrome Dev
log_level=info
fence_editor_text=1
; Prefer MV3 companion (DOM paste). Falls back to UIA if extension not connected.
prefer_extension=1
; Stable id from extension/manifest.json "key". Change only if you load without that key.
; extension_id=aodehlngahndannepofbddnacfaldmih
; Velopack update feed (directory with releases.win.json). Empty = GitHub latest/download.
; update_url=https://github.com/summeroff/qiuckprompts/releases/latest/download
; Binding url= and update_url= must be https:// (http / javascript / file rejected).
; log_level=info (default) logs sizes only. debug/trace may preview clipboard/editor text.
; Start tray app at logon via HKCU Run when set to 1 (applied on next launch).
; Tray → Start with Windows toggles the Run key only (does not rewrite this ini).
; start_with_windows=0 (default) does not clear a Run key you enabled from the tray.
start_with_windows=0

; =============================================================================
; Meta — quick polish, stay close to original voice
; =============================================================================
[grammar_meta]
label=Grammar quick (Meta)
service=meta
hotkey=Ctrl+Alt+J
url=https://www.meta.ai/
title_hint=Meta
capture_editor=1
prompt<<<
Light edit only. Fix grammar, spelling, and awkward wording.
Keep my voice, tone, and meaning. Prefer minimal changes — do not rewrite into a different style.
Do a quick sanity / obvious-fact check only if something is clearly wrong; do not expand into a research brief.
Return:
1) corrected message (ready to paste)
2) short bullet list of changes (optional if tiny)

Message:
>>>

; =============================================================================
; Gemini — grammar with optional clipboard context
; Flow: select surrounding context on a page → Ctrl+C → focus draft → Ctrl+Alt+O
; =============================================================================
[grammar_context_gemini]
label=Grammar in context (Gemini)
service=gemini
hotkey=Ctrl+Alt+O
url=https://gemini.google.com/app
title_hint=Gemini
capture_editor=1
prompt<<<
I am posting the message below in an existing thread/context that readers can already see.
Do NOT restate or over-explain that context. Do NOT write a long preamble.
Only polish MY message: grammar, spelling, awkward wording. Keep my voice. Minimal edits.
If something is factually shaky, one short note is enough — no deep investigation.
Use the Context block only as background (it came from my clipboard before capture).

Return:
1) corrected message only (ready to paste)
2) optional one-line notes

My message:
```
{{TEXT}}
```

Context (may be empty — ignore if blank):
```
{{CONTEXT}}
```
>>>

; =============================================================================
; Gemini — improve message: fact-check + grammar + recommended rewrite
; =============================================================================
[fact_gemini]
label=Improve message (Gemini)
service=gemini
hotkey=Ctrl+Alt+K
url=https://gemini.google.com/app
title_hint=Gemini
capture_editor=1
prompt<<<
Improve the message below for posting. Do three jobs:

1) Fact-check — for each important claim: verdict (true / false / mixed / unclear), brief evidence, and sources (links or named publications when possible). Flag missing nuance and what would change the conclusion.
2) Grammar / clarity — spelling, grammar, awkward wording; keep my voice and intent unless a fact fix requires a wording change.
3) Recommended message — one ready-to-paste version that is factually safer and well-written. Prefer minimal style drift from my original.

Stay structured and high-signal; avoid fluff.

Return exactly:
A) Fact-check (bullets per claim)
B) Grammar / wording notes (short; skip if nothing material)
C) Recommended message (ready to paste)

Message:
>>>

; =============================================================================
; Grok — collaborate on an idea
; =============================================================================
[idea_grok]
label=Idea collab (Grok)
service=grok
hotkey=Ctrl+Alt+L
url=https://grok.com/
title_hint=Grok
capture_editor=1
prompt<<<
Let's collaborate on this idea. Treat me as a co-founder thinking out loud.
Push back where it is weak, sharpen the interesting angle, suggest 2–3 concrete next steps or experiments.
Keep it conversational and high-signal — no corporate slide-deck tone.

Idea / draft:
>>>

; =============================================================================
; Gemini — screenshot already on clipboard (Win+Shift+S then this hotkey)
; Better at reading dialog / UI structure from the image.
; =============================================================================
[screenshot_gemini]
label=Screenshot review (Gemini)
service=gemini
hotkey=Ctrl+Alt+I
url=https://gemini.google.com/app
title_hint=Gemini
capture_editor=0
require_clipboard_image=1
prompt<<<
I attached a screenshot of a page/dialog that includes my draft comment and surrounding UI context.
You are good at reading layout and structure from screenshots — use that.

Please:
1) Read the visible context from the image only (do not invent what you cannot see). Briefly note the dialog/page structure if it matters (who said what, reply target, UI labels).
2) Polish ONLY my draft comment for grammar, spelling, and awkward wording.
3) Keep my voice. Minimal edits. Do NOT over-explain the context — readers already see it.
4) Return the corrected comment ready to paste, plus a short change list if useful.
>>>

; =============================================================================
; ChatGPT — clipboard as song inspiration for Suno AI (Custom mode)
; Flow: copy source material → Ctrl+Alt+M → edit STYLE placeholder in chat if desired → send
; =============================================================================
[song_chatgpt]
label=Song from clipboard (ChatGPT → Suno)
service=chatgpt
hotkey=Ctrl+Alt+M
url=https://chatgpt.com/
title_hint=ChatGPT
capture_editor=0
prompt<<<
Turn the inspiration material below into a song I can generate in **Suno AI** (Custom mode: separate Style + Lyrics).

Before writing, briefly apply current Suno guidance yourself: known limits (style/lyrics length, no artist-name trademarks when restricted, Custom vs simple mode), useful abilities, and practical recommendations for strong results. Prefer up-to-date product knowledge if you have it; otherwise use solid recent best practices and say what you assumed.

Goals:
- Style field: genre + mood + era + instruments + vocal persona + production + dynamic arc (not just a genre word). Respect Suno style-field limits.
- Lyrics field: full song with structural metatags ([Verse], [Chorus], [Bridge], etc.), singable meter, clear hook. Respect lyrics length limits. No contradictory performance tags in one section.
- Optional: short title ideas and an Exclude-styles line if useful.

Preferred style / direction (edit this line before sending if you want a specific vibe; leave as-is for you to invent):
<<<STYLE: >>>

Return exactly:
1) **Suno Style** — one copy-paste block for the Style field
2) **Suno Lyrics** — one copy-paste block for the Lyrics field (with [Section] tags)
3) **Notes** — Suno tips you applied, title ideas, and anything I should tweak

Inspiration (from my clipboard — themes, phrases, story, mood; transform freely, do not paste it back as prose):
```
{{CONTEXT}}
```
>>>
