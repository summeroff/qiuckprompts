; qiuckprompts.ini — edit freely, restart the app to reload (or re-run).
; Each [section] is one hotkey binding: service + prompt + URL together.
;
; Paths for prompt= are relative to this file's directory, or absolute.
; hotkey: Ctrl+Alt+J style (also Ctrl, Alt, Shift, Win + letter/digit/F-key)

[settings]
browser_hint=Chrome
log_level=debug
fence_editor_text=1

; --- Meta: quick polish, stay close to original voice ---
[grammar_meta]
label=Grammar quick (Meta)
service=meta
hotkey=Ctrl+Alt+J
url=https://www.meta.ai/
title_hint=Meta
prompt=prompts/grammar_meta.txt
capture_editor=1

; --- Meta: grammar inside a thread/context; do not over-explain ---
[grammar_context_meta]
label=Grammar in context (Meta)
service=meta
hotkey=Ctrl+Alt+O
url=https://www.meta.ai/
title_hint=Meta
prompt=prompts/grammar_context_meta.txt
capture_editor=1

; --- Gemini: deeper fact-check / sources ---
[fact_gemini]
label=Deep fact-check (Gemini)
service=gemini
hotkey=Ctrl+Alt+K
url=https://gemini.google.com/app
title_hint=Gemini
prompt=prompts/fact_gemini.txt
capture_editor=1

; --- Grok: collaborate on an idea ---
[idea_grok]
label=Idea collab (Grok)
service=grok
hotkey=Ctrl+Alt+L
url=https://grok.com/
title_hint=Grok
prompt=prompts/idea_grok.txt
capture_editor=1

; --- Screenshot already on clipboard → Meta ---
[screenshot_meta]
label=Screenshot review (Meta)
service=meta
hotkey=Ctrl+Alt+I
url=https://www.meta.ai/
title_hint=Meta
prompt=prompts/screenshot_meta.txt
capture_editor=0
require_clipboard_image=1
